<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report — NeuroLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../assets/img/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="../site.webmanifest">
<meta name="theme-color" content="#fcfaf8">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body data-root="../" data-active="dashboard" data-shell="app" data-nav="report">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main class="container page" id="main" tabindex="-1">
  <div class="no-print" style="display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <button class="btn primary" id="printBtn">Print / Save as PDF</button>
  </div>

  <article class="paper" id="paper">
    <div class="empty" id="rEmpty" hidden role="status"><div class="e-ico"><i data-icon="file" data-size="32"></i></div><h2 class="h3">Nothing to report yet</h2><p>Analyze a few Reels first.</p></div>
    <div id="rBody" hidden>
      <header class="paper-head">
        <div class="brand" id="rBrand"></div>
        <div style="text-align:right"><h1 id="rTitle" class="paper-title"></h1><div class="muted" id="rSub" style="font-size:13px"></div></div>
      </header>
      <div id="rLevel"></div>
      <div class="stats" id="rStats"></div>
      <h2 class="h3 paper-h">Emotion mix</h2>
      <div id="rBars"></div>
      <div id="rFlagWrap"><h2 class="h3 paper-h">Flagged Reels</h2><div id="rFlags"></div></div>
      <h2 class="h3 paper-h" id="rTipsH">Suggestions</h2>
      <ul id="rTips" class="tips"></ul>
      <p class="muted" style="font-size:12px;margin-top:22px">Generated by NeuroLens from emotional tone only. It cannot detect explicit or unsafe content and is not a substitute for professional advice.</p>
    </div>
  </article>
</main>

<div id="site-footer"></div>
<script src="../js/core/moods.js"></script>
<script src="../js/core/store.js"></script>
<script src="../js/data/sample.js"></script>
<script src="../js/core/wellbeing.js"></script>
<script src="../js/core/icons.js"></script>
<script src="../js/core/layout.js"></script>
<script src="../js/pages/report.js"></script>
</body>
</html>
